<html>
<head>
    <script src="./script.js"></script>
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <div class="loader">
        <div class="lds-dual-ring"></div>
    </div>

    <header>
        <div class="wrapper">
            <div class="cart">
                <div>
                    <img src="./imgs/shopping-cart.png" alt="Cart" />
                    <div id="cart-counter" class="hide">0</div>
                </div>
            </div>
        </div>
    </header>

    <div class="cart-view-wrapper hide">
        <div class="blur"></div>
        <div id="cart-view">
            <div class="title">
                <div>Cart view</div>
                <img id="cart-view-close" src="./imgs/close.png" style="cursor:pointer; width:20px;" />
            </div>
            <div class="cart-view-list"></div>
            <div class="total-price">
                Total price:
                <span id="total-price-value">0</span> USD
            </div>
        </div>
    </div>

    <div class="items-container">
        <div class="wrapper">
            <div class="filters">
                <div class="search">
                    Search: <input id="search-input" type="text" placeholder="Type to search..." />
                </div>

                <div class="price">
                    Price:
                    <input id="price-min" type="number" min="0" placeholder="from" />
                    <input id="price-max" type="number" min="0" placeholder="to" />
                </div>

                <div class="category">
                    Category:
                    <select id="category-select">
                        <option value="All">All</option>
                    </select>
                </div>

                <div class="rating">
                    Rating:
                    <div class="rating-options">
                        <div>
                            <label><input type="radio" value="0" name="rating-selector" checked> All</label>
                        </div>
                        <div>
                            <label><input type="radio" value="1" name="rating-selector"> 1+</label>
                        </div>
                        <div>
                            <label><input type="radio" value="2" name="rating-selector"> 2+</label>
                        </div>
                        <div>
                            <label><input type="radio" value="3" name="rating-selector"> 3+</label>
                        </div>
                        <div>
                            <label><input type="radio" value="4" name="rating-selector"> 4+</label>
                        </div>
                        <div>
                            <label><input type="radio" value="5" name="rating-selector"> 5</label>
                        </div>
                    </div>
                </div>

                <div class="extra-functions">
                    Extra functions:
                    <div class="extra-functions-container">
                        </div>
                </div>
            </div>

            <div class="items"></div>
        </div>
    </div>
</body>
</html>
